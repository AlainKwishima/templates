spring.application.name=ims

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ims_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-to-a-secure-random-value}
jwt.expiration=86400000

# Brevo (Sendinblue) Configuration Placeholder
brevo.api.key=${BREVO_API_KEY:your-brevo-api-key-here}
brevo.sender.email=noreply@example.com
brevo.sender.name=IMS System

# Swagger UI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
