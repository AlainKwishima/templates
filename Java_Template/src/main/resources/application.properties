# ============================================================
# Application
# ============================================================
spring.application.name=JavaT

# Imports the local override file if it exists.
# application-local.properties is gitignored — put real credentials there.
# The "optional:" prefix means the app still starts if the file is absent
# (e.g. in CI/CD where credentials come from environment variables instead).
spring.config.import=optional:classpath:application-local.properties

# ============================================================
# Database (PostgreSQL)
# ============================================================
# These are placeholder values overridden by application-local.properties locally
# and by environment variables / secrets manager in production.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/national_examination_java
spring.datasource.username=postgres
spring.datasource.password=mukabareke
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ============================================================
# JWT
# ============================================================
# Generate with: openssl rand -base64 32
# Must be Base64-encoded and at least 256 bits (32 bytes) for HS256.
app.jwt.secret=change-me-generate-with-openssl-rand-base64-32
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=${spring.application.name}

# ============================================================
# CORS (SPA frontend)
# ============================================================
app.cors.allowed-origins[0]=http://localhost:5173
app.cors.allowed-origins[1]=http://localhost:3000

# ============================================================
# Spring Security
# ============================================================
app.security.public-paths[0]=/api/v1/auth/**
app.security.public-paths[1]=/v3/api-docs/**
app.security.public-paths[2]=/swagger-ui/**
app.security.public-paths[3]=/swagger-ui.html
app.security.public-paths[4]=/actuator/health

# Disable Spring Mail auto-config (SMTP removed — Brevo API is used)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ============================================================
# Email — Brevo transactional API
# Set credentials via environment variables or application-local.properties (gitignored).
# NEVER commit BREVO_API_KEY to source control.
# ============================================================
app.brevo.api-url=${BREVO_API_URL:https://api.brevo.com}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.timeout-ms=${BREVO_TIMEOUT_MS:15000}

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${BREVO_SENDER_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:JavaT}
app.mail.api-base-url=${MAIL_API_BASE_URL:http://localhost:8080}
app.mail.frontend-base-url=${MAIL_FRONTEND_BASE_URL:http://localhost:5173}
app.mail.validate-on-startup=${MAIL_VALIDATE_ON_STARTUP:true}
app.mail.fail-fast-on-startup-error=${MAIL_FAIL_FAST_ON_STARTUP_ERROR:true}
app.mail.retry-max-attempts=${MAIL_RETRY_MAX_ATTEMPTS:3}
app.mail.retry-delay-ms=${MAIL_RETRY_DELAY_MS:2000}
app.mail.test-recipient=${MAIL_TEST_RECIPIENT:}
app.mail.test-subject=${MAIL_TEST_SUBJECT:JavaT — Brevo delivery test}

# ============================================================
# Async (email thread pool)
# ============================================================
app.async.core-pool-size=2
app.async.max-pool-size=5
app.async.queue-capacity=100
app.async.thread-name-prefix=async-email-

# ============================================================
# Token expiry
# ============================================================
app.auth.password-reset-token-expiry-minutes=15
app.auth.verification-token-expiry-hours=24
